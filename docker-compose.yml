version: "3.9"
services:
  mongo:
    image: mongo:7
    container_name: monopoly-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev -w server"
    volumes:
      - ./:/app
    environment:
      - MONGO_URI=mongodb://mongo:27017/monopoly
      - PORT=4000
    ports:
      - "4000:4000"
    depends_on:
      - mongo

  client:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev -w client -- --host"
    volumes:
      - ./:/app
    environment:
      - VITE_SERVER_URL=http://localhost:4000
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  mongo_data:
